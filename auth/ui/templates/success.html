{{define "success.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<div class="card">
    <div class="card-header">
        <div class="card-title">authorization status</div>
        <div class="card-status">
            <span class="status-dot green"></span>
            <span style="color: hsl(var(--smui-green));">nominal</span>
        </div>
    </div>
    <div class="card-content">
        <div class="alert alert-success">
            <svg class="alert-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="alert-content">
                <div class="alert-title">success</div>
                <div class="alert-description">
                    The server has successfully saved the credentials for {{.ProviderName}}. You can now close this browser tab or return to the status dashboard.
                </div>
            </div>
        </div>
        <a href="/status" class="btn btn-primary">return to status dashboard</a>
    </div>
</div>
{{end}}
