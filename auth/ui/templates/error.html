{{define "error.html"}}
{{template "layout" .}}
{{end}}

{{define "content"}}
<div class="card">
    <div class="card-header">
        <div class="card-title">authorization status</div>
        <div class="card-status">
            <span class="status-dot red"></span>
            <span style="color: hsl(var(--smui-red));">critical</span>
        </div>
    </div>
    <div class="card-content">
        <div class="alert alert-destructive">
            <svg class="alert-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div class="alert-content">
                <div class="alert-title">error</div>
                <div class="alert-description">
                    {{.ErrorMessage}}
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 1rem;">
            <a href="/status" class="btn btn-primary">return to status dashboard</a>
        </div>
    </div>
</div>
{{end}}
